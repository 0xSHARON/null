<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.34" stop-color="#ffd60a"/>
      <stop offset="0.67" stop-color="#30d158"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="1.5" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- Dark brutalist/web-card backdrop -->
  <rect width="64" height="64" rx="10" fill="#111"/>
  <rect x="3" y="3" width="58" height="58" rx="7" fill="url(#bg)"/>

  <!-- Offset card layer -->
  <g transform="translate(8 7) rotate(-8 24 24)" filter="url(#shadow)">
    <rect width="42" height="48" rx="5" fill="#f4f4f0" stroke="#111" stroke-width="3"/>
    <path d="M3 36L36 3h3v10L13 39H3z" fill="#111"/>
    <text x="5" y="18" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900" fill="#111">NULL</text>
    <text x="21" y="34" text-anchor="middle"
          font-family="Arial Black,Arial,sans-serif" font-size="25" font-weight="900"
          fill="#fff" stroke="#111" stroke-width="1.5" paint-order="stroke">N</text>
    <text x="34" y="44" font-family="Arial,Helvetica,sans-serif" font-size="6" font-weight="900" fill="#111">00</text>
  </g>

  <!-- Front card -->
  <g transform="translate(15 10) rotate(7 22 24)" filter="url(#shadow)">
    <rect width="42" height="48" rx="5" fill="#fff" stroke="#111" stroke-width="3"/>
    <path d="M3 36L36 3h3v10L13 39H3z" fill="#e31b23"/>
    <text x="5" y="18" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="900" fill="#111">NULL</text>
    <text x="21" y="34" text-anchor="middle"
          font-family="Arial Black,Arial,sans-serif" font-size="24" font-weight="900"
          fill="#e31b23" stroke="#111" stroke-width="1.2" paint-order="stroke">N</text>
    <text x="34" y="44" font-family="Arial,Helvetica,sans-serif" font-size="6" font-weight="900" fill="#111">01</text>
  </g>

  <!-- Small corner marks -->
  <path d="M5 56h10M5 52v8M49 8h10M59 5v10" stroke="#fff" stroke-width="2"/>
</svg>
